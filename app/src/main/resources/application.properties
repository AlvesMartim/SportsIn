# Configuration Spring Boot pour SportsIn
# Le projet utilise SQLite créé via le script create_database.sh

# ============================================
# DATABASE CONFIGURATION
# ============================================
# SQLite database - utilise le chemin parent du projet
spring.datasource.url=jdbc:sqlite:../sportsin.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# ============================================
# JPA / HIBERNATE CONFIGURATION
# ============================================
# Dialect pour SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# DDL auto ne crée/modifie pas de tables (la BD est créée par schema.sql)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.jdbc.lob.non_contextual_creation=true

# Affichage du SQL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Initialiser la base de données avec schema.sql au démarrage
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:schema.sql,classpath:data.sql

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8080
server.servlet.context-path=/
spring.application.name=SportsIn

# ============================================
# MISSION SCHEDULER
# ============================================
# Mettre à false pour désactiver le scheduler de missions (utile en test)
mission.scheduler.enabled=true

# ============================================
# WEATHER ENGINE (FEATURE 7)
# ============================================
weather.scheduler.enabled=true
weather.scheduler.timezone=Europe/Paris
weather.scheduler.flash-missions-cron=0 0 */6 * * *
weather.scheduler.territory-decay-cron=0 15 3 * * *
weather.openweather.enabled=true
weather.openweather.api-key=${OPENWEATHER_API_KEY:}
weather.openweather.base-url=https://api.openweathermap.org
weather.openweather.timeout-ms=3500
# Cache TTL pour les appels OpenWeather (limite quota gratuit 60 req/min).
weather.openweather.cache-ttl-seconds=600

# ============================================
# LOGGING
# ============================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# STRAVA INTEGRATION
# Set STRAVA_CLIENT_ID, STRAVA_CLIENT_SECRET, STRAVA_WEBHOOK_VERIFY_TOKEN as env vars.
# Never commit real secrets here.
# ============================================
strava.client-id=${STRAVA_CLIENT_ID:258210}
strava.client-secret=${STRAVA_CLIENT_SECRET:cffd8dc4fd22c053983650f5b4f532813f48b99e}
strava.webhook-verify-token=${STRAVA_WEBHOOK_VERIFY_TOKEN:sportsin_webhook_verify}
strava.redirect-uri=${STRAVA_REDIRECT_URI:http://localhost:8080/api/strava/callback}
strava.frontend-url=${STRAVA_FRONTEND_URL:http://localhost:5173}
strava.api-base-url=https://www.strava.com/api/v3
strava.auth-url=https://www.strava.com/oauth/authorize
strava.token-url=https://www.strava.com/oauth/token
strava.rate-limit-per-15min=100
strava.rate-limit-per-day=1000
strava.max-activities-per-sync=200
